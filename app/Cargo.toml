[package]
name = "native-csviewer"
description = "Engine-free native CS Viewer: winit window + wgpu GPU + egui panels (no browser engine)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "native-csviewer"
path = "src/main.rs"

[dependencies]
# The engine, reused read-only by path. It is never edited from this fork.
csgraph-core = { path = "../core" }

egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", features = ["winit", "x11", "wayland"] }
egui-winit = { version = "0.37", default-features = false, features = [
    "clipboard",
    "links",
    "x11",
    "wayland",
] }
wgpu = { version = "30", default-features = false, features = [
    "std",
    "vulkan",
    "gles",
    "wgsl",
    "parking_lot",
] }
winit = "0.30.13"
pollster = "0.4"
serde_json = "1"
# The VSCode-like source IDE pane lives in its own repo and is pinned to a
# commit (the host supplies the graph through its `Language` trait).
nzkide-module = { git = "https://github.com/NaruZkurai/nzk-cs-nzkide_module.git", rev = "e4f104fe901d2f0a9db2886b935d4864ca66e59e" }
# The Scratch puzzle-piece pane lives in its own repo; it has no csgraph
# knowledge, only host-neutral data.
scratch-rs-ide-addon = { git = "https://github.com/NaruZkurai/nzk-csViewer-scratch_rs_ide_addon.git", rev = "d5491fef11bfb08653c668241a4415f07ff1659f" }
# Global definition token numbers (the def2mcpfnnumber addon); see
# app/src/tokens.rs for the graph bridge and `--tokens` for the smoke test.
def2mcpfnnumber = { git = "https://github.com/NaruZkurai/nzk-cs-def2mcpfnnumber_rs_ide_addon.git", rev = "a063dfc8ffd6306b7a15dcd8959241df4ae684ac" }
image = { version = "0.25", default-features = false, features = ["png"] }
