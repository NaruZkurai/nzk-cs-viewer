[package]
name = "csviewer"
description = "CS Viewer v2 — native window for the csgraph C# relation graph (Rust engine)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "csviewer"
path = "src/main.rs"

[dependencies]
csgraph-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = "2"
