<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>monaco probe</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #d4d4d4;
               font: 12px/1.5 "JetBrains Mono", Consolas, monospace; }
  #editor { width: 100vw; height: 70vh; }
  #legacy { position: absolute; left: -9999px; top: 0; width: 900px; }
  #out { white-space: pre; padding: 6px 10px; }
</style>
<script src="/tools/csgraph/static/vendor/monaco/min/vs/loader.js"></script>
</head>
<body>
<div id="editor"></div>
<div id="legacy"></div>
<pre id="out">booting…</pre>
<script>
'use strict';
var log = document.getElementById('out');
var lines = [];
function say(m) {
  lines.push(m);
  log.textContent = lines.join('\n');
  if (window.console && console.log) console.log('[probe] ' + m);
}
window.onerror = function (e) { say('WINDOW-ERROR ' + e); };

var MONO = '/tools/csgraph/static/vendor/monaco/min/vs';
require.config({ paths: { vs: MONO }, 'ignoreDuplicateModules': true });

function ms(t0) { return Math.round(performance.now() - t0); }

fetch('/_sealed_src/nzktoolkit_monolith_compilable.cs.nzk')
  .then(function (r) { if (!r.ok) throw new Error('fetch ' + r.status); return r.text(); })
  .then(function (text) {
    say('source: ' + text.length + ' bytes, ' + text.split('\n').length + ' lines');
    window.__TEXT = text;
    require(['vs/editor/editor.main'], function (monaco) {
      say('monaco loaded: ' + (monaco && monaco.editor ? 'yes' : 'NO'));
      try {
        var t0 = performance.now();
        var model = monaco.editor.createModel(text, 'csharp');
        var ed = monaco.editor.create(document.getElementById('editor'), {
          model: model, theme: 'vs-dark', readOnly: true, automaticLayout: false,
          minimap: { enabled: true }, fontSize: 12, lineNumbers: 'on',
          renderWhitespace: 'none', scrollBeyondLastLine: false
        });
        ed.layout({ width: 1200, height: 700 });
        var createMs = ms(t0);

        // Force a real viewport render + a scroll deep into the file, which is
        // exactly what the old line-DOM renderer could not survive.
        var t1 = performance.now();
        ed.revealLine(9000);
        ed.setScrollTop(ed.getScrollHeight());
        ed.render(true);
        var scrollMs = ms(t1);
        var t2 = performance.now();
        var vis = ed.getVisibleRanges();
        var linesVisible = 0;
        for (var i = 0; i < vis.length; i++) linesVisible += vis[i].endLineNumber - vis[i].startLineNumber;
        var readMs = ms(t2);
        say('monaco: model+create+layout=' + createMs + 'ms  revealBottom=' + scrollMs +
            'ms  visibleRanges=' + linesVisible + ' lines in ' + readMs + 'ms');
        say('monaco: tokens sample=' + JSON.stringify(
          (model.tokenization.getLineTokens(120).getCount ? model.tokenization.getLineTokens(120).getCount() : '?') +
          ' tokens on line 120'));

        // ---- what the old renderer did: one <div> + N <span> per line --------
        var t3 = performance.now();
        var body = document.getElementById('legacy');
        var frag = document.createDocumentFragment();
        var arr = text.split('\n');
        for (var L = 0; L < arr.length; L++) {
          var row = document.createElement('div');
          row.className = 'sline';
          var num = document.createElement('span');
          num.className = 'ln';
          num.textContent = String(L + 1);
          var txt = document.createElement('span');
          txt.className = 'lt';
          txt.textContent = arr[L];
          row.appendChild(num); row.appendChild(txt);
          frag.appendChild(row);
        }
        body.appendChild(frag);
        var legacyMs = ms(t3);
        say('legacy line-DOM: ' + arr.length + ' rows appended in ' + legacyMs +
            'ms (no tokenizer spans — the real one splits each line into ' +
            '5-20 more spans)');
        var t4 = performance.now();
        body.getBoundingClientRect();
        say('legacy forced layout: ' + ms(t4) + 'ms');
        say('RESULT ' + JSON.stringify({ lines: arr.length, createMs: createMs,
          scrollMs: scrollMs, legacyMs: legacyMs }));
        window.__DONE = true;
      } catch (e) {
        say('MONACO-ERROR ' + (e && e.stack ? e.stack : e));
        window.__DONE = true;
      }
    }, function (err) {
      say('REQUIRE-FAIL ' + err);
      window.__DONE = true;
    });
  })
  .catch(function (e) {
    say('FETCH-ERROR ' + e.message);
    window.__DONE = true;
  });
</script>
</body>
</html>
