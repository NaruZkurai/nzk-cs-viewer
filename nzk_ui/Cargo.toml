# nzk_ui — its OWN cargo workspace (see the [workspace] table) so it shares no
# Cargo.lock or target dir with the parent fork workspace while other owners build
# `app/`. It is still inside the fork, as task-11 asks.
[workspace]

[package]
name = "nzk_ui"
description = "CSS-driven renderer: parses the real frontend index.html + style.css with Blitz/Stylo in Rust, no browser engine, no JS"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "nzk_ui"
path = "src/main.rs"

[dependencies]
blitz-dom = "0.2"
blitz-html = "0.2"
blitz-paint = "0.2"
blitz-traits = "0.2"
anyrender = "0.6"
# 0.8.1 is the last anyrender_vello_cpu that pairs with anyrender 0.6.x (blitz 0.2.1).
anyrender_vello_cpu = { version = "=0.8.1", features = ["multithreading"] }
parley = "0.6"
fontique = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
